<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azur Lane Live2D & Spine Viewer</title>
  <script src="/static/live2dcubismcore.min.js"></script>
  <script src="/static/pixi.min.js"></script>
  <script src="/static/cubism4.min.js"></script>
  <script src="/static/spine-webgl.js"></script>
  <style>
    :root {
      --bg: #0f1218;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --primary-hover: #79b8ff;
      --accent: #3fb950;
      --danger: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container.grabbing {
      cursor: grabbing;
    }

    #spine-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Background patterns */
    .bg-checkerboard {
      background-image: linear-gradient(45deg, #1b2028 25%, transparent 25%), 
                        linear-gradient(-45deg, #1b2028 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1b2028 75%), 
                        linear-gradient(-45deg, transparent 75%, #1b2028 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
      background-color: #12161c;
    }
    .bg-dark { background-color: #14171d; }
    .bg-black { background-color: #000000; }
    .bg-white { background-color: #ffffff; }

    /* Glass UI overlay panels */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    /* Header Bar */
    header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand svg {
      fill: var(--primary);
    }

    .search-group {
      flex: 1;
      min-width: 220px;
      max-width: 420px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 38px;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      padding: 0 12px 0 34px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 10px;
      width: 16px;
      height: 16px;
      fill: var(--text-muted);
      pointer-events: none;
    }
    .search-clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }

    .search-clear-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    .dropdown-header {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #12161c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .engine-filter-group {
      display: flex;
      align-items: center;
      background: rgba(13, 17, 23, 0.7);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }
    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .filter-btn.active {
      color: #ffffff;
      background: var(--primary);
    }

    .engine-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      display: inline-block;
    }

    .engine-spine {
      background: rgba(163, 113, 247, 0.2);
      color: #d2a8ff;
      border: 1px solid rgba(163, 113, 247, 0.4);
    }

    .engine-live2d {
      background: rgba(56, 139, 253, 0.2);
      color: #58a6ff;
      border: 1px solid rgba(56, 139, 253, 0.4);
    }

    .character-dropdown {
      position: absolute;
      top: 44px;
      right: 0;
      width: 420px;
      max-width: calc(100vw - 32px);
      max-height: 420px;
      overflow-y: auto;
      background: #161b22;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 100;
    }

    .dropdown-item {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 13.5px;
      transition: background 0.15s;
    }

    .dropdown-item:hover, .dropdown-item.active {
      background: rgba(88, 166, 255, 0.15);
    }

    .dropdown-item .char-name {
      font-weight: 600;
      color: var(--text);
    }

    .dropdown-item .char-skin {
      color: var(--primary);
      font-size: 12.5px;
      font-weight: 500;
      margin-top: 2px;
    }

    .dropdown-item .char-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .model-info-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      background: rgba(88, 166, 255, 0.1);
      border: 1px solid rgba(88, 166, 255, 0.25);
      border-radius: 8px;
      font-size: 13.5px;
      white-space: nowrap;
      min-width: 0;
      max-width: 440px;
      overflow: hidden;
      flex-shrink: 1;
    }

    .model-ship-title {
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .model-title-sep {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .model-skin-title {
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .model-skin-badge {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(88, 166, 255, 0.2);
      color: #79c0ff;
      font-weight: 500;
    }

    .active-skin-display {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 4px 10px;
    }

    .active-skin-display .skin-label {
      color: var(--text-muted);
    }

    .active-skin-display .skin-name-text {
      color: var(--primary);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Controls Dock (Bottom) */
    .controls-dock {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 18px;
      width: min(840px, calc(100% - 32px));
    }

    .playback-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
    }

    .btn-primary {
      background: var(--primary);
      color: #0d1117;
      border-color: var(--primary);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn.active {
      background: rgba(63, 185, 80, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .select-dropdown {
      height: 36px;
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text);
      padding: 0 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .select-dropdown:focus {
      border-color: var(--primary);
    }

    .timeline-container {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scrubber {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .scrubber::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .time-label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 90px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 18, 24, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      transition: opacity 0.3s;
      pointer-events: none;
      opacity: 0;
    }

    #loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(88, 166, 255, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    /* Status Toast */
    #toast {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--text);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(4px);
    }
  </style>
</head>
<body>

  <!-- WebGL Rendering Canvas -->
  <div id="canvas-container" class="bg-checkerboard">
    <canvas id="spine-canvas"></canvas>
    <canvas id="live2d-canvas" style="display: none; width: 100%; height: 100%;"></canvas>
  </div>

  <!-- Header -->
  <header class="glass-panel">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path d="M12 2a3 3 0 0 0-3 3c0 1.31.84 2.42 2 2.83V11H9a1 1 0 0 0-1 1v1h2v7.17c-2.3-.43-4.2-2.12-4.8-4.37l1.93-.52a1 1 0 0 0 .7-1.22 1 1 0 0 0-1.23-.7l-3.87 1.04a1 1 0 0 0-.7 1.22C2.9 19.33 5.92 21.75 9.5 22h5c3.58-.25 6.6-2.67 7.47-6.38a1 1 0 0 0-.7-1.22l-3.87-1.04a1 1 0 0 0-1.23.7 1 1 0 0 0 .7 1.22l1.93.52c-.6 2.25-2.5 3.94-4.8 4.37V13h2v-1a1 1 0 0 0-1-1h-2V7.83c1.16-.41 2-1.52 2-2.83a3 3 0 0 0-3-3zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
      </svg>
      <span>Live2D & Spine</span>
    </div>

    <!-- Prominent Character & Skin Banner -->
    <div id="model-info-banner" class="model-info-banner" style="display: none;">
      <span id="model-ship-name" class="model-ship-title">Ship</span>
      <span class="model-title-sep">—</span>
      <span id="model-skin-name" class="model-skin-title">Skin</span>
      <span id="model-skin-type" class="model-skin-badge" style="display: none;"></span>
      <span id="model-prefab-badge" class="char-tag">id</span>
    </div>

    <div class="engine-filter-group">
      <button class="filter-btn active" data-engine="all" id="filter-all">All</button>
      <button class="filter-btn" data-engine="spine" id="filter-spine">Spine</button>
      <button class="filter-btn" data-engine="live2d" id="filter-live2d">Live2D</button>
    </div>
    <div class="search-group">
      <svg class="search-icon" viewBox="0 0 24 24">
        <path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.38a1 1 0 0 1-1.42 1.42l-5.38-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/>
      </svg>
      <input type="text" id="character-search" class="search-input" placeholder="Search ship, skin, tag (e.g. Belfast, Alsace, bunny)..." autocomplete="off" />
      <button id="btn-search-clear" class="search-clear-btn" style="display: none;" title="Clear search">✕</button>
      <div id="character-dropdown" class="character-dropdown"></div>
    </div>

    <div class="header-actions">
      <button id="btn-variant" class="btn" style="display: none;" title="Toggle censored/uncensored model variant">Variant: Standard</button>
      <button id="btn-screenshot" class="btn" title="Save snapshot PNG (Key: S)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
        Snapshot
      </button>
    </div>
  </header>

  <!-- Controls Dock (Bottom) -->
  <div class="controls-dock glass-panel">
    <!-- Playback bar -->
    <div class="playback-bar">
      <button id="btn-play-pause" class="btn btn-icon btn-primary" title="Play/Pause (Space)">
        <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button id="btn-loop" class="btn btn-icon active" title="Toggle loop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
      </button>

      <select id="select-animation" class="select-dropdown" style="min-width: 170px;" title="Select Animation">
        <option value="">No animation</option>
      </select>

      <div class="timeline-container">
        <input type="range" id="scrubber" class="scrubber" min="0" max="1" step="0.01" value="0" />
        <span id="time-display" class="time-label">0.00s / 0.00s</span>
      </div>

      <select id="select-speed" class="select-dropdown" style="width: 82px;" title="Playback speed">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.5">1.5x</option>
        <option value="2.0">2.0x</option>
      </select>
    </div>

    <!-- Options and Viewport settings -->
    <div class="options-row">
      <div class="toggle-group">
        <div class="active-skin-display" title="Active Character Skin">
          <span class="skin-label">Skin:</span>
          <span id="active-skin-title" class="skin-name-text">—</span>
        </div>

        <label id="spine-rig-container" class="toggle-label" style="display: none;" title="Spine internal attachment skin">
          Rig:
          <select id="select-skin" class="select-dropdown" style="height: 30px; padding: 0 6px;">
            <option value="default">default</option>
          </select>
        </label>
        <label id="spine-layer-container" class="toggle-label" style="display: none;" title="Layer visibility">
          Layer:
          <select id="select-layer" class="select-dropdown" style="height: 30px; padding: 0 6px;">
            <option value="all">All Layers (Combined)</option>
          </select>
        </label>

        <label class="toggle-label" title="Render Quality & Supersampling (SSAA)">
          Quality:
          <select id="select-scale" class="select-dropdown" style="height: 30px; padding: 0 6px;">
            <option value="1.0">1x Native</option>
            <option value="1.5" selected>1.5x Sharp</option>
            <option value="2.0">2x Ultra (SSAA)</option>
          </select>
        </label>

        <label class="toggle-label" title="Background style">
          BG:
          <select id="select-bg" class="select-dropdown" style="height: 30px; padding: 0 6px;">
            <option value="bg-checkerboard">Checkerboard</option>
            <option value="bg-dark">Slate Dark</option>
            <option value="bg-black">Pure Black</option>
            <option value="bg-white">Pure White</option>
          </select>
        </label>
      </div>

      <div class="toggle-group">
        <label class="toggle-label">
          <input type="checkbox" id="chk-pma" checked /> Premultiplied Alpha
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="chk-bones" /> Bones
        </label>
        <label id="live2d-hitareas-container" class="toggle-label" style="display: none;" title="Show interactive touch areas">
          <input type="checkbox" id="chk-hitareas" /> Hitboxes
        </label>
        <button id="btn-reset-view" class="btn" style="height: 30px; padding: 0 10px;" title="Center character (Key: R)">Reset View</button>
      </div>
    </div>
  </div>

  <!-- Loading Screen -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Loading Spine Model...</div>
  </div>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script>
    // Global State
    var characters = [];
    var currentModel = null;
    var currentVariant = null; // null or '_hx'
    var availableVariants = [];
    var manifestData = null;
    window.__L2D_VIEWER__ = {
      get characters() { return characters; },
      get currentModel() { return currentModel; },
      get currentLive2DModel() { return currentLive2DModel; },
      selectCharacter: (c) => selectCharacter(c),
      triggerLive2DTouchReaction: (x, y) => triggerLive2DTouchReaction(x, y),
      triggerLive2DDragReaction: (sx, sy, ex, ey, hits) => triggerLive2DDragReaction(sx, sy, ex, ey, hits),
      updateLive2DHitAreasOverlay: () => updateLive2DHitAreasOverlay()
    };
    // Spine & WebGL Objects
    var canvas, gl, sceneRenderer, assetManager;
    var loadedLayers = []; // [{ id, role, order, skeleton, animState, skeletonData, activeTrack, atlas }]
    var skeleton = null;
    var animState = null;
    var activeTrack = null;
    // Camera / Pan & Zoom State
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let camStartX = 0, camStartY = 0;
    let isPlaying = true;
    let isLooping = true;
    let isScrubbing = false;
    let lastFrameTime = Date.now();
    // Live2D State
    var live2dApp = null;
    var currentLive2DModel = null;
    var live2dDragging = false;
    var live2dDragStart = { x: 0, y: 0 };
    var live2dModelPos = { x: 0, y: 0 };
    var live2dDragHitOnCharacter = false;
    var live2dDragStartHits = [];
    let activeFilterEngine = "all";
    const spineRigContainer = document.getElementById("spine-rig-container");

    // DOM Elements

    // Initialize WebGL and Spine runtime
    function initWebGL() {
      canvas = document.getElementById("spine-canvas");
      const ctxAttribs = {
        alpha: true,
        antialias: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      };

      // Prefer WebGL 2 for full NPOT mipmapping and hardware anti-aliasing
      gl = canvas.getContext("webgl2", ctxAttribs) ||
           canvas.getContext("webgl", ctxAttribs) ||
           canvas.getContext("experimental-webgl", ctxAttribs);

      if (!gl) {
        alert("WebGL is not supported in this browser.");
        return;
      }
      // Preserve exact 100% bit-accurate texture colors (prevent browser gamma/colorspace drift)
      try {
        gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
      } catch (_) {}

      // Configure high-quality texture filtering: trilinear mipmapping & anisotropic filtering
      setupTextureFilteringEnhancements();

      sceneRenderer = new spine.webgl.SceneRenderer(canvas, gl);
      assetManager = new spine.webgl.AssetManager(gl);

      window.addEventListener("resize", resizeCanvas);
      if (selectScale) {
        selectScale.addEventListener("change", resizeCanvas);
      }
      resizeCanvas();
      setupInteractions();
      requestAnimationFrame(renderLoop);
    }

    function setupTextureFilteringEnhancements() {
      if (!window.spine || !window.spine.webgl) return;

      // Patch SceneRenderer.resize so it does not overwrite canvas.width / supersampled buffer
      if (spine.webgl.SceneRenderer) {
        spine.webgl.SceneRenderer.prototype.resize = function (resizeMode) {
          const gl = this.context.gl;
          gl.viewport(0, 0, this.canvas.width, this.canvas.height);
          if (resizeMode === spine.webgl.ResizeMode.Expand) {
            this.camera.setViewport(this.canvas.clientWidth, this.canvas.clientHeight);
          }
        };
      }

      if (!spine.webgl.GLTexture) return;

      const ext = gl.getExtension("EXT_texture_filter_anisotropic") ||
                  gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic") ||
                  gl.getExtension("MOZ_EXT_texture_filter_anisotropic");
      const maxAniso = ext ? (gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT) || 4) : 0;

      // Patch setFilters: upgrade linear minification to trilinear mipmap filter
      const origSetFilters = spine.webgl.GLTexture.prototype.setFilters;
      spine.webgl.GLTexture.prototype.setFilters = function (minFilter, magFilter) {
        // Upgrade Linear (9729) or Nearest to trilinear MipMapLinearLinear (9987)
        if (minFilter === 9729 || minFilter === spine.TextureFilter.Linear) {
          minFilter = spine.TextureFilter.MipMapLinearLinear;
        }
        origSetFilters.call(this, minFilter, magFilter);

        // Ensure mipmap generation and anisotropic filtering on GPU
        const contextGl = this.context.gl;
        this.bind();
        try {
          contextGl.generateMipmap(contextGl.TEXTURE_2D);
        } catch (_) {}

        if (ext && maxAniso > 1) {
          contextGl.texParameterf(contextGl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(maxAniso, 16));
        }
      };

      // Patch update: always generate mipmaps when texture image is uploaded
      const origUpdate = spine.webgl.GLTexture.prototype.update;
      spine.webgl.GLTexture.prototype.update = function (useMipMaps) {
        origUpdate.call(this, true);

        const contextGl = this.context.gl;
        this.bind();
        contextGl.texParameteri(contextGl.TEXTURE_2D, contextGl.TEXTURE_MIN_FILTER, contextGl.LINEAR_MIPMAP_LINEAR);
        contextGl.texParameteri(contextGl.TEXTURE_2D, contextGl.TEXTURE_MAG_FILTER, contextGl.LINEAR);
        try {
          contextGl.generateMipmap(contextGl.TEXTURE_2D);
        } catch (_) {}

        if (ext && maxAniso > 1) {
          contextGl.texParameterf(contextGl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(maxAniso, 16));
        }
      };
    }
    function resizeCanvas() {
      const scale = selectScale ? (parseFloat(selectScale.value) || 1.5) : 1.5;
      const dpr = Math.max(1, window.devicePixelRatio || 1) * scale;

      // 1. Spine canvas resize
      if (canvas) {
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        if (sceneRenderer) {
          sceneRenderer.resize(spine.webgl.ResizeMode.Expand);
        }
      }

      // 2. Live2D canvas resize
      if (live2dApp && live2dApp.renderer) {
        const container = document.getElementById("canvas-container");
        live2dApp.renderer.resolution = dpr;
        live2dApp.renderer.autoDensity = true;
        live2dApp.renderer.resize(container.clientWidth, container.clientHeight);
      }
    }

    // Pan and Zoom Interaction
    function setupInteractions() {
      canvasContainer.addEventListener("contextmenu", (e) => e.preventDefault());
      canvasContainer.addEventListener("mousedown", (e) => {
        if (e.button !== 0 && e.button !== 1) return;
        isDragging = true;
        canvasContainer.classList.add("grabbing");
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        if (sceneRenderer) {
          camStartX = sceneRenderer.camera.position.x;
          camStartY = sceneRenderer.camera.position.y;
        }
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging || !sceneRenderer) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        const zoom = sceneRenderer.camera.zoom;
        // Invert dy because WebGL Y points up
        sceneRenderer.camera.position.x = camStartX - dx * zoom;
        sceneRenderer.camera.position.y = camStartY + dy * zoom;
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
        canvasContainer.classList.remove("grabbing");
      });

      canvasContainer.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (!sceneRenderer) return;
        const zoomFactor = e.deltaY > 0 ? 1.1 : 0.9;
        sceneRenderer.camera.zoom = Math.max(0.05, Math.min(20.0, sceneRenderer.camera.zoom * zoomFactor));
      }, { passive: false });

      // Keyboard shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.code === "Space") {
          e.preventDefault();
          if (currentModel && currentModel.engine === "spine") {
            togglePlayPause();
          }
        } else if (e.code === "KeyR") {
          resetCamera();
        } else if (e.code === "KeyS") {
          captureScreenshot();
        }
      });
    }

    function filterAndRenderDropdown() {
      const q = searchInput.value.trim().toLowerCase();
      const tokens = q ? q.split(/\s+/).filter(Boolean) : [];

      const filtered = characters.filter(c => {
        if (activeFilterEngine !== "all" && c.engine !== activeFilterEngine) {
          return false;
        }
        if (tokens.length === 0) return true;

        const searchable = `${c.ship_name} ${c.skin_name} ${c.skin_type || ''} ${c.id} ${c.engine} ${c.has_hx ? 'censored hx' : ''}`.toLowerCase();
        return tokens.every(token => {
          if (token === "l2d") return c.engine === "live2d";
          if (token === "spine") return c.engine === "spine";
          return searchable.includes(token);
        });
      });

      renderDropdown(filtered);
    }

    function selectCharacter(char) {

      isDragging = false;

    // Load Spine Model files
    async function loadModel(prefabId) {
      showLoading(`Loading ${prefabId}...`);
      try {
        // Switch active canvas to Spine
        document.getElementById("live2d-canvas").style.display = "none";
        document.getElementById("spine-canvas").style.display = "block";
        if (currentLive2DModel && live2dApp) {
          currentLive2DModel.internalModel?.motionManager?.stopAllMotions();
          live2dApp.stage.removeChild(currentLive2DModel);
          currentLive2DModel.destroy({ children: true });
          currentLive2DModel = null;
        }
        chkPma.parentElement.style.display = "flex";
        btnPlayPause.style.display = "";
        btnLoop.style.display = "";
        if (timelineContainer) timelineContainer.style.display = "";
        selectSpeed.style.display = "";
        chkBones.parentElement.style.display = "flex";
        if (live2dHitAreasContainer) live2dHitAreasContainer.style.display = "none";
        const infoResp = await fetch(`/api/model/${prefabId}/info`);
        manifestData = await infoResp.json();

        // Determine available layers and check for censored variant (_hx)
        const allLayers = manifestData.layers || [];
        const hasHx = allLayers.some(l => l.is_hx);

        if (hasHx) {
          btnVariant.style.display = "inline-flex";
          btnVariant.textContent = currentVariant === "_hx" ? "Variant: Censored (_hx)" : "Variant: Uncensored";
        } else {
          btnVariant.style.display = "none";
        }

        // Select active layers based on current variant:
        // Group layers by their base role/part (e.g. weizhang_2T and weizhang_2T_hx share the same base)
        const layerGroups = new Map();
        for (const l of allLayers) {
          const key = l.id.replace("_hx", "");
          if (!layerGroups.has(key)) layerGroups.set(key, []);
          layerGroups.get(key).push(l);
        }

        const activeLayerDefs = [];
        for (const [key, variants] of layerGroups.entries()) {
          if (currentVariant === "_hx") {
            const hxLayer = variants.find(v => v.is_hx);
            activeLayerDefs.push(hxLayer || variants[0]);
          } else {
            const normalLayer = variants.find(v => !v.is_hx);
            activeLayerDefs.push(normalLayer || variants[0]);
          }
        }
        activeLayerDefs.sort((a, b) => a.order - b.order);

        // Update layer dropdown UI
        selectLayer.innerHTML = '<option value="all">All Layers (Combined)</option>';
        if (activeLayerDefs.length > 1) {
          for (const l of activeLayerDefs) {
            const opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = `${l.role} (${l.id})`;
            selectLayer.appendChild(opt);
          }
          spineLayerContainer.style.display = "inline-flex";
        } else {
          spineLayerContainer.style.display = "none";
        }
        selectLayer.value = "all";

        // Load all active layer assets through AssetManager
        assetManager.removeAll();
        for (const l of activeLayerDefs) {
          assetManager.loadBinary(`/api/model/${prefabId}/files/${l.skel}`);
          assetManager.loadTextureAtlas(`/api/model/${prefabId}/files/${l.atlas}`);
        }

        // Wait for download
        await waitForAssets();

        // Configure anisotropic filtering & mipmaps on all loaded atlases
        const ext = gl.getExtension("EXT_texture_filter_anisotropic") ||
                    gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic") ||
                    gl.getExtension("MOZ_EXT_texture_filter_anisotropic");
        const maxAniso = ext ? (gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT) || 4) : 0;

        loadedLayers = [];
        for (const l of activeLayerDefs) {
          const atlasPath = `/api/model/${prefabId}/files/${l.atlas}`;
          const skelPath = `/api/model/${prefabId}/files/${l.skel}`;
          const atlas = assetManager.get(atlasPath);

          if (atlas && atlas.pages) {
            atlas.pages.forEach(page => {
              const tex = page.texture;
              if (tex) {
                tex.bind();
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                try {
                  gl.generateMipmap(gl.TEXTURE_2D);
                } catch (_) {}
                if (ext && maxAniso > 1) {
                  gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(maxAniso, 16));
                }
              }
            });
          }

          const atlasLoader = new spine.AtlasAttachmentLoader(atlas);
          const binary = new spine.SkeletonBinary(atlasLoader);
          const skelBytes = assetManager.get(skelPath);
          const skeletonData = binary.readSkeletonData(new Uint8Array(skelBytes));

          const skel = new spine.Skeleton(skeletonData);
          skel.setToSetupPose();
          skel.updateWorldTransform();

          const animStateData = new spine.AnimationStateData(skeletonData);
          animStateData.defaultMix = 0.25;
          const animSt = new spine.AnimationState(animStateData);

          loadedLayers.push({
            id: l.id,
            role: l.role,
            order: l.order,
            skeleton: skel,
            skeletonData: skeletonData,
            animState: animSt,
            activeTrack: null,
            atlas: atlas
          });
        }

        // Pick primary layer (prefer Foreground / highest order)
        const primaryLayer = loadedLayers[loadedLayers.length - 1];
        skeleton = primaryLayer ? primaryLayer.skeleton : null;
        animState = primaryLayer ? primaryLayer.animState : null;

        // Populate animations dropdown (union across all layers, sorted with common ones first)
        selectAnimation.innerHTML = "";
        const animMap = new Map();
        for (const l of loadedLayers) {
          for (const a of l.skeletonData.animations) {
            if (!animMap.has(a.name)) {
              animMap.set(a.name, a.duration);
            } else {
              animMap.set(a.name, Math.max(animMap.get(a.name), a.duration));
            }
          }
        }

        animMap.forEach((duration, name) => {
          const opt = document.createElement("option");
          opt.value = name;
          opt.textContent = `${name} (${duration.toFixed(2)}s)`;
          selectAnimation.appendChild(opt);
        });

        // Populate Spine rig skins dropdown from primary layer
        const rigContainer = document.getElementById("spine-rig-container");
        selectSkin.innerHTML = "";
        let initialSkin = "default";
        if (primaryLayer && primaryLayer.skeletonData.skins && primaryLayer.skeletonData.skins.length > 1) {
          const skin1 = primaryLayer.skeletonData.skins.find(s => s.name === "1");
          const nonDefault = primaryLayer.skeletonData.skins.find(s => s.name !== "default");
          initialSkin = skin1 ? skin1.name : (nonDefault ? nonDefault.name : "default");

          primaryLayer.skeletonData.skins.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.name;
            let label = s.name;
            if (s.name === "1") label = "Outfit 1 (Default)";
            else if (s.name === "2") label = "Outfit 2 (Variant)";
            else if (s.name === "3") label = "Outfit 3 (Variant)";
            else if (s.name === "default") label = "Base / Props";
            opt.textContent = label;
            selectSkin.appendChild(opt);
          });
          selectSkin.value = initialSkin;
          if (rigContainer) rigContainer.style.display = "inline-flex";
        } else {
          if (rigContainer) rigContainer.style.display = "none";
        }

        applySkinToAllLayers(initialSkin);
        // Set default animation ('normal' preferred)
        const defaultAnimName = animMap.has("normal") ? "normal" : (animMap.keys().next().value || "");
        if (defaultAnimName) {
          selectAnimation.value = defaultAnimName;
          applyAnimationToAllLayers(defaultAnimName);
        }

        resetCamera();
        hideLoading();
        showToast(`Loaded ${prefabId}`);
      } catch (err) {
        console.error("Error loading Spine model:", err);
        hideLoading();
        showToast(`Failed to load ${prefabId}: ${err.message}`);
      }
    }
    async function initLive2DApp() {
      if (live2dApp) return;
      const l2dCanvas = document.getElementById("live2d-canvas");
      const container = document.getElementById("canvas-container");
      const scale = selectScale ? (parseFloat(selectScale.value) || 1.5) : 1.5;
      const dpr = Math.max(1, window.devicePixelRatio || 1) * scale;
      live2dApp = new PIXI.Application({
        view: l2dCanvas,
        autoStart: true,
        backgroundAlpha: 0,
        resolution: dpr,
        autoDensity: true,
        antialias: true,
        preserveDrawingBuffer: true,
        width: container.clientWidth,
        height: container.clientHeight
      });

      // Mouse tracking for Live2D focus (eye & head tracking)
      container.addEventListener("pointermove", (e) => {
        if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
          const rect = container.getBoundingClientRect();
          const canvasX = e.clientX - rect.left;
          const canvasY = e.clientY - rect.top;

          if (live2dDragging) {
            const dx = e.clientX - live2dDragStart.x;
            const dy = e.clientY - live2dDragStart.y;
            // Pan model if drag started outside character, or if holding Shift/Alt or using secondary/middle mouse buttons
            if (!live2dDragHitOnCharacter || e.buttons !== 1 || e.shiftKey || e.altKey) {
              currentLive2DModel.x = live2dModelPos.x + dx;
              currentLive2DModel.y = live2dModelPos.y + dy;
            } else {
              // Interactive drag on character: eye and head track cursor
              currentLive2DModel.focus(canvasX, canvasY);
            }
          } else {
            currentLive2DModel.focus(canvasX, canvasY);
          }
        }
      });

      // Dragging and touch interaction for Live2D model
      container.addEventListener("pointerdown", (e) => {
        if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
          live2dDragging = true;
          live2dDragStart = { x: e.clientX, y: e.clientY };
          live2dModelPos = { x: currentLive2DModel.x, y: currentLive2DModel.y };

          const rect = container.getBoundingClientRect();
          const canvasX = e.clientX - rect.left;
          const canvasY = e.clientY - rect.top;

          if (e.button === 0 && !e.shiftKey && !e.altKey) {
            const hits = currentLive2DModel.hitTest(canvasX, canvasY) || [];
            live2dDragStartHits = hits;

            const modelPos = new PIXI.Point();
            currentLive2DModel.toModelPosition(new PIXI.Point(canvasX, canvasY), modelPos);
            live2dDragHitOnCharacter = (hits.length > 0) || isPointOnLive2DCharacter(modelPos);
          } else {
            live2dDragHitOnCharacter = false;
            live2dDragStartHits = [];
          }
          container.classList.add("grabbing");
        }
      });

      window.addEventListener("pointerup", (e) => {
        if (live2dDragging && currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
          const dist = Math.hypot(e.clientX - live2dDragStart.x, e.clientY - live2dDragStart.y);
          const rect = container.getBoundingClientRect();
          const canvasX = e.clientX - rect.left;
          const canvasY = e.clientY - rect.top;

          if (dist < 10) {
            // Tap interaction on character (only with pure left click without modifier keys)!
            if (e.button === 0 && !e.shiftKey && !e.altKey) {
              triggerLive2DTouchReaction(canvasX, canvasY);
            }
          } else if (dist >= 25 && live2dDragHitOnCharacter && e.button === 0 && !e.shiftKey && !e.altKey) {
            // Swipe/Drag gesture interaction!
            const startCanvasX = live2dDragStart.x - rect.left;
            const startCanvasY = live2dDragStart.y - rect.top;
            triggerLive2DDragReaction(startCanvasX, startCanvasY, canvasX, canvasY, live2dDragStartHits);
          }
        }
        live2dDragging = false;
        live2dDragHitOnCharacter = false;
        live2dDragStartHits = [];
        container.classList.remove("grabbing");
      });

      function cancelLive2DDrag() {
        if (live2dDragging) {
          live2dDragging = false;
          live2dDragHitOnCharacter = false;
          live2dDragStartHits = [];
          container.classList.remove("grabbing");
        }
        // Smoothly return character gaze to center when pointer leaves canvas
        if (currentLive2DModel && currentLive2DModel.internalModel?.focusController) {
          currentLive2DModel.internalModel.focusController.focus(0, 0, false);
        }
      }

      container.addEventListener("pointerleave", cancelLive2DDrag);
      window.addEventListener("pointercancel", cancelLive2DDrag);

      // Zooming Live2D model
      container.addEventListener("wheel", (e) => {
        if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.1 : 0.9;
          currentLive2DModel.scale.x *= factor;
          currentLive2DModel.scale.y *= factor;
        }
      }, { passive: false });
    }


    async function loadLive2DModel(prefabId) {
      showLoading(`Loading Live2D ${prefabId}...`);
      try {
        await initLive2DApp();

        // Switch active canvas to Live2D
        document.getElementById("spine-canvas").style.display = "none";
        document.getElementById("live2d-canvas").style.display = "block";

        // Hide Spine-specific controls
        spineRigContainer.style.display = "none";
        spineLayerContainer.style.display = "none";
        chkPma.parentElement.style.display = "none";
        chkBones.parentElement.style.display = "none";
        if (live2dHitAreasContainer) live2dHitAreasContainer.style.display = "flex";
        btnPlayPause.style.display = "none";
        btnLoop.style.display = "none";
        if (timelineContainer) timelineContainer.style.display = "none";
        selectSpeed.style.display = "none";

        // Reset Spine active layers so Spine loop is dormant
        loadedLayers = [];
        skeleton = null;

        if (currentLive2DModel) {
          currentLive2DModel.internalModel?.motionManager?.stopAllMotions();
          live2dApp.stage.removeChild(currentLive2DModel);
          currentLive2DModel.destroy({ children: true });
          currentLive2DModel = null;
        }

        let modelName = prefabId;
        if (currentVariant === "_hx") {
          modelName = prefabId + "_hx";
        }

        const modelUrl = `/api/live2d/${modelName}/files/model3.json`;
        const model = await PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: true });

        currentLive2DModel = model;
        live2dApp.stage.addChild(model);
        // Setup interactive hit areas for Live2D touch reactions
        setupLive2DHitAreas(model);
        // Setup parameter restoration & smooth damping across interaction transitions
        setupLive2DParameterDamping(model);

        // Configure high-quality anisotropic filtering & mipmapping on Live2D textures
        try {
          const gl = live2dApp.renderer.gl;
          const ext = gl.getExtension("EXT_texture_filter_anisotropic") ||
                      gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic") ||
                      gl.getExtension("MOZ_EXT_texture_filter_anisotropic");
          const maxAniso = ext ? (gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT) || 4) : 0;
          const textures = model.textures || model.internalModel?.textures || [];
          for (const tex of textures) {
            const bt = tex?.baseTexture;
            if (!bt) continue;
            bt.mipmap = PIXI.MIPMAP_MODES.ON;
            live2dApp.renderer.texture.bind(bt, 0);
            const glTex = bt._glTextures ? bt._glTextures[live2dApp.renderer.CONTEXT_UID] : null;
            if (glTex?.texture && ext && maxAniso > 1) {
              gl.bindTexture(gl.TEXTURE_2D, glTex.texture);
              gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(maxAniso, 16));
            }
          }
        } catch (e) {
          console.warn("Failed to configure Live2D anisotropic filtering:", e);
        }

        // Suppress full-screen curtain / dark overlay meshes (e.g. wuqi_3 scene-darkening overlay)
        try {
          const core = model.internalModel?.coreModel;
          const renderer = model.internalModel?.renderer;
          if (core && renderer) {
            const count = core.getDrawableCount();
            const parentPartIndices = core._model?.drawables?.parentPartIndices;
            const badDrawables = new Set();
            const badParts = new Set();

            for (let i = 0; i < count; i++) {
              const blend = core.getDrawableBlendMode(i);
              const v = core.getDrawableVertexPositions(i);
              let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
              for (let j = 0; j < v.length; j += 2) {
                minX = Math.min(minX, v[j]);
                maxX = Math.max(maxX, v[j]);
                minY = Math.min(minY, v[j + 1]);
                maxY = Math.max(maxY, v[j + 1]);
              }
              const w = maxX - minX;
              const h = maxY - minY;

              // Detect giant multiply / blackout quads (> 60 units span)
              if (blend === 2 && (w > 60 || h > 60)) {
                badDrawables.add(i);
                if (parentPartIndices) {
                  badParts.add(parentPartIndices[i]);
                }
              }
            }

            if (badParts.size > 0 && parentPartIndices) {
              for (let i = 0; i < count; i++) {
                if (badParts.has(parentPartIndices[i])) {
                  badDrawables.add(i);
                }
              }
            }

            if (badDrawables.size > 0) {
              for (const p of badParts) {
                core.setPartOpacityByIndex(p, 0);
              }
              console.log(`[Live2D] Suppressed ${badDrawables.size} fullscreen overlay mesh(es) in parts:`, Array.from(badParts));
            }

            // Dynamic filter: intercept drawMesh to suppress fullscreen curtain/wipe/blackout quads
            const origDrawMesh = renderer.drawMesh;
            renderer.drawMesh = function(t, e, i, indices, vertices, uvs, opacity, blend, isInverted) {
              // Check for 4-vertex quads spanning all 4 viewport quadrants (> 80 units)
              if (i === 4 && vertices) {
                const gl = live2dApp?.renderer?.gl;
                const fb = gl ? gl.getParameter(gl.FRAMEBUFFER_BINDING) : null;
                if (!fb) {
                  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                  for (let k = 0; k < vertices.length; k += 2) {
                    minX = Math.min(minX, vertices[k]);
                    maxX = Math.max(maxX, vertices[k]);
                    minY = Math.min(minY, vertices[k + 1]);
                    maxY = Math.max(maxY, vertices[k + 1]);
                  }
                  if (minX < -80 && maxX > 80 && minY < -80 && maxY > 80) {
                    return; // Skip drawing giant fullscreen wipe/curtain quad!
                  }
                }
              }
              return origDrawMesh.apply(this, arguments);
            };
          }
        } catch (e) {
          console.warn("Failed to check Live2D overlay meshes:", e);
        }
        resetLive2DCamera();

        // Variant button
        if (currentModel.has_hx) {
          btnVariant.style.display = "inline-flex";
          btnVariant.textContent = currentVariant === "_hx" ? "Variant: Censored (_hx)" : "Variant: Uncensored";
        } else {
          btnVariant.style.display = "none";
        }
        // Populate animations dropdown with extracted Live2D motions
        selectAnimation.innerHTML = "";
        const mm = model.internalModel?.motionManager;
        const definitions = mm?.definitions;
        const motionGroups = definitions ? Object.keys(definitions) : [];

        if (motionGroups.length > 0) {
          const priority = (name) => {
            const n = name.toLowerCase();
            if (n === "idle") return 0;
            if (n.startsWith("idle")) return 1;
            if (n.startsWith("main")) return 2;
            if (n.startsWith("touch_head")) return 3;
            if (n.startsWith("touch_body")) return 4;
            if (n.startsWith("touch_special")) return 5;
            if (n.startsWith("touch")) return 6;
            if (n.startsWith("login")) return 7;
            if (n.startsWith("home")) return 8;
            if (n.startsWith("wedding")) return 9;
            return 20;
          };
          motionGroups.sort((a, b) => {
            const pa = priority(a);
            const pb = priority(b);
            if (pa !== pb) return pa - pb;
            return a.localeCompare(b);
          });

          motionGroups.forEach(mName => {
            const opt = document.createElement("option");
            opt.value = mName;
            opt.textContent = mName;
            selectAnimation.appendChild(opt);
          });

          const initialMotion = motionGroups.includes("idle") ? "idle" : (motionGroups.find(m => m.startsWith("idle")) || motionGroups[0]);
          selectAnimation.value = initialMotion;
          playLive2DMotion(initialMotion);
          timeDisplay.textContent = `${motionGroups.length} motions loaded`;

          // Listen for motion finish to support loop and automatic return to idle
          mm.on("motionFinish", () => {
            if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
              if (isLooping) {
                const anim = selectAnimation.value;
                if (anim) playLive2DMotion(anim);
              } else {
                const idleMotion = motionGroups.includes("idle") ? "idle" : (motionGroups.find(m => m.startsWith("idle")) || "");
                if (idleMotion && selectAnimation.value !== idleMotion) {
                  selectAnimation.value = idleMotion;
                  playLive2DMotion(idleMotion);
                }
              }
            }
          });
        } else {
          selectAnimation.innerHTML = `<option value="">Tracking / Physics Only</option>`;
          timeDisplay.textContent = "Live2D Active";
        }
        selectSkin.innerHTML = `<option value="default">Default</option>`;
        hideLoading();
        showToast(`Loaded Live2D: ${currentModel.ship_name}`);
      } catch (err) {
        hideLoading();
        console.error("Failed to load Live2D model:", err);
        showToast(`Failed to load Live2D: ${err.message}`);
      }
    }

    function resetLive2DCamera() {
      if (!currentLive2DModel) return;
      const container = document.getElementById("canvas-container");
      const cw = container.clientWidth;
      const ch = container.clientHeight;

      const mw = currentLive2DModel.width;
      const mh = currentLive2DModel.height;
      const scale = Math.min((cw * 0.8) / mw, (ch * 0.85) / mh);

      currentLive2DModel.scale.set(scale);
      currentLive2DModel.anchor.set(0.5, 0.5);
      currentLive2DModel.x = cw / 2;
      currentLive2DModel.y = ch / 2;

      // Snap gaze and focus back to dead center
      if (currentLive2DModel.internalModel?.focusController) {
        currentLive2DModel.internalModel.focusController.focus(0, 0, true);
      }
      live2dDragging = false;
      live2dDragHitOnCharacter = false;
      live2dDragStartHits = [];
      container.classList.remove("grabbing");
    }

    function setupLive2DHitAreas(model) {
      if (!model || !model.internalModel || !model.internalModel.coreModel) return;
      const im = model.internalModel;
      const core = im.coreModel;
      const ids = core._drawableIds || [];

      im.hitAreas = {};
      for (let i = 0; i < ids.length; i++) {
        const id = ids[i];
        if (/^Touch_?Head/i.test(id)) im.hitAreas["Head"] = { id, index: i };
        else if (/^Touch_?Special/i.test(id)) im.hitAreas["Special"] = { id, index: i };
        else if (/^Touch_?Body/i.test(id)) im.hitAreas["Body"] = { id, index: i };
        else if (/^Touch_?Drag/i.test(id)) im.hitAreas[id] = { id, index: i };
        else if (/^Touch_?Idle/i.test(id)) im.hitAreas[id] = { id, index: i };
      }

      // Semantic fallback if no explicit TouchHead/Special/Body found
      if (!im.hitAreas["Head"]) {
        const headIdx = ids.findIndex(id => /head|face|tou|lian/i.test(id));
        if (headIdx !== -1) im.hitAreas["Head"] = { id: ids[headIdx], index: headIdx };
      }
      if (!im.hitAreas["Special"]) {
        const specialIdx = ids.findIndex(id => /bust|chest|breast|xiong|oppai/i.test(id));
        if (specialIdx !== -1) im.hitAreas["Special"] = { id: ids[specialIdx], index: specialIdx };
      }
      if (!im.hitAreas["Body"]) {
        const bodyIdx = ids.findIndex(id => /body|shen/i.test(id));
        if (bodyIdx !== -1) im.hitAreas["Body"] = { id: ids[bodyIdx], index: bodyIdx };
      }

      console.log(`[Live2D] Registered ${Object.keys(im.hitAreas).length} hit areas:`, Object.keys(im.hitAreas));
      updateLive2DHitAreasOverlay();
    }

    function setupLive2DParameterDamping(model) {
      if (!model || !model.internalModel || !model.internalModel.coreModel) return;
      const im = model.internalModel;
      const core = im.coreModel;
      const count = core.getParameterCount();

      // Cache model rest pose default values
      const defaults = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        defaults[i] = core.getParameterDefaultValue(i);
      }

      let lastTime = performance.now();

      // Hook beforeMotionUpdate: smoothly decay unmanaged or lingering parameters
      // toward their resting defaults (tau = 0.25s matching Azur Lane Live2dChar DampingTime)
      im.on("beforeMotionUpdate", () => {
        const now = performance.now();
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        const factor = 1 - Math.exp(-dt / 0.25);

        for (let i = 0; i < count; i++) {
          const cur = core.getParameterValueByIndex(i);
          const def = defaults[i];
          const diff = def - cur;
          if (Math.abs(diff) > 0.0001) {
            if (Math.abs(diff) < 0.001) {
              core.setParameterValueByIndex(i, def);
            } else {
              core.setParameterValueByIndex(i, cur + diff * factor);
            }
          }
        }
      });
    }

    function updateLive2DHitAreasOverlay() {
      if (!currentLive2DModel || !currentLive2DModel.internalModel) return;
      const existing = currentLive2DModel.children.find(c => c.name === "hitAreaDebug");
      if (existing) {
        currentLive2DModel.removeChild(existing);
        existing.destroy();
      }

      if (!chkHitAreas || !chkHitAreas.checked) return;

      const im = currentLive2DModel.internalModel;
      if (!im.hitAreas) return;

      const g = new PIXI.Graphics();
      g.name = "hitAreaDebug";

      const colors = {
        Head: 0x00e5ff,      // cyan
        Special: 0xff007f,   // magenta / hot pink
        Body: 0x00e676,      // green
        default: 0xffd600    // yellow for Drag / Idle
      };

      const b = {};
      for (const [name, info] of Object.entries(im.hitAreas)) {
        if (typeof info.index !== "number") continue;
        im.getDrawableBounds(info.index, b);
        if (b.width <= 0 || b.height <= 0) continue;

        const color = colors[name] || (name.startsWith("TouchDrag") ? 0xffab00 : colors.default);
        g.lineStyle(3, color, 0.85);
        g.beginFill(color, 0.18);
        g.drawRect(b.x, b.y, b.width, b.height);
        g.endFill();
      }

      currentLive2DModel.addChild(g);
    }
    window.updateLive2DHitAreasOverlay = updateLive2DHitAreasOverlay;

    function findMatchingLive2DMotion(candidates) {
      if (!currentLive2DModel || !currentLive2DModel.internalModel) return null;
      const mm = currentLive2DModel.internalModel.motionManager;
      if (!mm || !mm.definitions) return null;
      const available = Object.keys(mm.definitions);

      // Exact match first
      for (const c of candidates) {
        if (available.includes(c)) return c;
      }
      // Case-insensitive match
      for (const c of candidates) {
        const found = available.find(a => a.toLowerCase() === c.toLowerCase());
        if (found) return found;
      }
      // Substring match
      for (const c of candidates) {
        const found = available.find(a => a.toLowerCase().includes(c.toLowerCase()));
        if (found) return found;
      }
      return null;
    }

    function isPointOnLive2DCharacter(modelPos) {
      if (!currentLive2DModel || !currentLive2DModel.internalModel) return false;
      const im = currentLive2DModel.internalModel;
      const core = im.coreModel;
      if (!core) return false;

      const b = {};
      const opacities = core.getDrawableOpacities ? core.getDrawableOpacities() : null;
      for (let i = 0; i < core._drawableIds.length; i++) {
        if (opacities && opacities[i] <= 0.05) continue;
        im.getDrawableBounds(i, b);
        if (b.width > im.originalWidth * 0.9 && b.height > im.originalHeight * 0.9) continue;
        if (modelPos.x >= b.x && modelPos.x <= b.x + b.width &&
            modelPos.y >= b.y && modelPos.y <= b.y + b.height) {
          return true;
        }
      }
      return false;
    }

    function triggerLive2DTouchReaction(canvasX, canvasY) {
      if (!currentLive2DModel || !currentLive2DModel.internalModel) return;
      const im = currentLive2DModel.internalModel;
      const mm = im.motionManager;
      if (!mm || !mm.definitions) return;

      const hits = currentLive2DModel.hitTest(canvasX, canvasY) || [];
      console.log("[Live2D] Tap at", canvasX, canvasY, "hits:", hits);

      let targetMotion = null;
      let hitLabel = "";

      if (hits.includes("Head")) {
        hitLabel = "Head";
        targetMotion = findMatchingLive2DMotion(["touch_head", "touchHead", "touch", "main_1"]);
      } else if (hits.includes("Special")) {
        hitLabel = "Special";
        targetMotion = findMatchingLive2DMotion(["touch_special", "touchSpecial", "touch_body", "touch", "main_2"]);
      } else if (hits.includes("Body")) {
        hitLabel = "Body";
        targetMotion = findMatchingLive2DMotion(["touch_body", "touchBody", "touch", "main_3", "main_1"]);
      } else if (hits.some(h => /Touch_?Drag/i.test(h))) {
        const dragHit = hits.find(h => /Touch_?Drag/i.test(h));
        const numMatch = dragHit?.match(/\d+/);
        const candidates = [];
        if (numMatch) {
          candidates.push(`touch_drag${numMatch[0]}`, `touch_drag_${numMatch[0]}`);
        }
        candidates.push("touch_drag", "touch_special", "touch_body", "touch");
        hitLabel = dragHit || "Drag Area";
        targetMotion = findMatchingLive2DMotion(candidates);
      } else if (hits.some(h => /Touch_?Idle/i.test(h))) {
        const idleHit = hits.find(h => /Touch_?Idle/i.test(h));
        const numMatch = idleHit?.match(/\d+/);
        const candidates = [];
        if (numMatch) {
          candidates.push(`touch_idle${numMatch[0]}`, `touch_idle_${numMatch[0]}`);
        }
        candidates.push("touch_body", "touch", "main_1", "main_2", "main_3");
        hitLabel = idleHit || "Touch";
        targetMotion = findMatchingLive2DMotion(candidates);
      } else {
        // Fallback: check if clicked on any visible character mesh
        const modelPos = new PIXI.Point();
        currentLive2DModel.toModelPosition(new PIXI.Point(canvasX, canvasY), modelPos);
        if (isPointOnLive2DCharacter(modelPos)) {
          hitLabel = "Character";
          targetMotion = findMatchingLive2DMotion(["touch_body", "touch", "main_1", "main_2", "main_3"]);
        }
      }

      if (targetMotion) {
        playLive2DMotion(targetMotion);
        showToast(`🎯 ${hitLabel}: ${targetMotion}`);
      }
    }
    window.triggerLive2DTouchReaction = triggerLive2DTouchReaction;

    function triggerLive2DDragReaction(startX, startY, endX, endY, startHits) {
      if (!currentLive2DModel || !currentLive2DModel.internalModel) return;
      const im = currentLive2DModel.internalModel;
      const mm = im.motionManager;
      if (!mm || !mm.definitions) return;

      // Prioritize specific TouchDrag number from initiating hit
      const candidates = [];
      for (const h of (startHits || [])) {
        const m = h.match(/Touch_?Drag(\d+)/i);
        if (m) {
          candidates.push(`touch_drag${m[1]}`, `touch_drag_${m[1]}`);
        }
      }
      candidates.push(
        "touch_drag", "touch_drag1", "touch_drag2", "touch_drag3", "touch_drag4",
        "touch_special", "touch_body"
      );
      const dragMotion = findMatchingLive2DMotion(candidates);

      if (dragMotion) {
        playLive2DMotion(dragMotion);
        showToast(`👆 Drag Reaction: ${dragMotion}`);
      }
    }
    window.triggerLive2DDragReaction = triggerLive2DDragReaction;

    function playLive2DMotion(motionName) {
      if (!currentLive2DModel || !motionName) return;
      selectAnimation.value = motionName;
      // Reset timeline scrubber on new motion
      isScrubbing = false;
      scrubber.value = 0;
      try {
        currentLive2DModel.motion(motionName, 0, 3);
        showToast(`Playing: ${motionName}`);
      } catch (e) {
        console.warn("Failed to play Live2D motion:", motionName, e);
      }
    }

    function applyAnimationToAllLayers(animName) {
      for (const l of loadedLayers) {
        if (l.skeletonData.animations.some(a => a.name === animName)) {
          l.activeTrack = l.animState.setAnimation(0, animName, isLooping);
        } else if (l.skeletonData.animations.some(a => a.name === "normal")) {
          l.activeTrack = l.animState.setAnimation(0, "normal", isLooping);
        } else if (l.skeletonData.animations.length > 0) {
          l.activeTrack = l.animState.setAnimation(0, l.skeletonData.animations[0].name, isLooping);
        }
      }
      const primary = loadedLayers[loadedLayers.length - 1];
      activeTrack = (primary && primary.activeTrack) ? primary.activeTrack : (loadedLayers.find(l => l.activeTrack)?.activeTrack || null);
    }
    function applySkinToAllLayers(skinName) {
      for (const l of loadedLayers) {
        if (l.skeletonData.skins.some(s => s.name === skinName)) {
          l.skeleton.setSkinByName(skinName);
        } else if (l.skeletonData.skins.some(s => s.name === "default")) {
          l.skeleton.setSkinByName("default");
        }
        l.skeleton.setSlotsToSetupPose();
      }
    }


    function waitForAssets() {
      return new Promise((resolve, reject) => {
        const check = () => {
          if (assetManager.isLoadingComplete()) {
            if (assetManager.hasErrors()) {
              reject(new Error(JSON.stringify(assetManager.getErrors())));
            } else {
              resolve();
            }
          } else {
            requestAnimationFrame(check);
          }
        };
        check();
      });
    }

    function resetCamera() {
      if (loadedLayers.length === 0 || !sceneRenderer) return;

      const activeLayers = selectLayer.value === "all"
        ? loadedLayers
        : loadedLayers.filter(l => l.id === selectLayer.value);

      if (activeLayers.length === 0) return;

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

      for (const l of activeLayers) {
        l.skeleton.setToSetupPose();
        l.skeleton.updateWorldTransform();
        const offset = new spine.Vector2();
        const size = new spine.Vector2();
        l.skeleton.getBounds(offset, size, []);

        if (size.x > 0 && size.y > 0) {
          minX = Math.min(minX, offset.x);
          minY = Math.min(minY, offset.y);
          maxX = Math.max(maxX, offset.x + size.x);
          maxY = Math.max(maxY, offset.y + size.y);
        }
      }

      let centerX = (minX + maxX) / 2;
      let centerY = (minY + maxY) / 2;
      let boxW = maxX - minX;
      let boxH = maxY - minY;

      // If bounds are excessively large (>5000px), focus camera on character bones
      const charLayer = loadedLayers[loadedLayers.length - 1];
      if ((boxW > 5000 || boxH > 5000) && charLayer) {
        let bMinX = Infinity, bMaxX = -Infinity, bMinY = Infinity, bMaxY = -Infinity;
        let bCount = 0;
        const bgKeywords = ["niao", "shui", "bj", "pangxie", "guang", "bg", "eff", "diban", "tian", "yun"];
        for (let i = 0; i < charLayer.skeleton.bones.length; i++) {
          const b = charLayer.skeleton.bones[i];
          const bName = b.data.name.toLowerCase();
          if (bgKeywords.some(k => bName.includes(k))) continue;
          if (b.worldX < bMinX) bMinX = b.worldX;
          if (b.worldX > bMaxX) bMaxX = b.worldX;
          if (b.worldY < bMinY) bMinY = b.worldY;
          if (b.worldY > bMaxY) bMaxY = b.worldY;
          bCount++;
        }
        if (bCount > 5 && bMaxX > bMinX && bMaxY > bMinY) {
          centerX = (bMinX + bMaxX) / 2;
          centerY = (bMinY + bMaxY) / 2;
          boxW = bMaxX - bMinX;
          boxH = bMaxY - bMinY;
        }
      }

      const canvasW = canvas.clientWidth;
      const canvasH = canvas.clientHeight;
      const fitW = (boxW || 1000) * 1.15;
      const fitH = (boxH || 1000) * 1.15;

      const zoom = Math.max(fitW / canvasW, fitH / canvasH);
      sceneRenderer.camera.position.x = centerX;
      sceneRenderer.camera.position.y = centerY;
      sceneRenderer.camera.zoom = Math.max(0.2, zoom);
    }

    // Animation & Playback Controls
    function togglePlayPause() {
      isPlaying = !isPlaying;
      iconPlay.style.display = isPlaying ? "none" : "block";
      iconPause.style.display = isPlaying ? "block" : "none";
      if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
        if (isPlaying) {
          const currentAnim = selectAnimation.value;
          if (currentAnim) playLive2DMotion(currentAnim);
        } else {
          currentLive2DModel.internalModel?.motionManager?.stopAllMotions();
        }
      }
    }

    btnPlayPause.addEventListener("click", togglePlayPause);

    btnLoop.addEventListener("click", () => {
      isLooping = !isLooping;
      btnLoop.classList.toggle("active", isLooping);
      for (const l of loadedLayers) {
        if (l.activeTrack) {
          l.activeTrack.loop = isLooping;
        }
      }
    });

    selectAnimation.addEventListener("change", () => {
      const name = selectAnimation.value;
      if (name) {
        if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
          playLive2DMotion(name);
        } else {
          applyAnimationToAllLayers(name);
          scrubber.value = 0;
        }
      }
    });
    selectSpeed.addEventListener("change", () => {
      const speed = parseFloat(selectSpeed.value) || 1.0;
      if (currentModel && currentModel.engine === "live2d" && live2dApp && live2dApp.ticker) {
        live2dApp.ticker.speed = isPlaying ? speed : 0;
      }
    });

    selectLayer.addEventListener("change", () => {
      resetCamera();
    });

    selectSkin.addEventListener("change", () => {
      applySkinToAllLayers(selectSkin.value);
      resetCamera();
    });

    selectBg.addEventListener("change", () => {
      canvasContainer.className = selectBg.value;
    });

    btnResetView.addEventListener("click", () => {
      if (currentModel && currentModel.engine === "live2d") {
        resetLive2DCamera();
      } else {
        resetCamera();
      }
    });

    btnVariant.addEventListener("click", () => {
      currentVariant = currentVariant === "_hx" ? null : "_hx";
      btnVariant.textContent = currentVariant === "_hx" ? "Variant: Censored (_hx)" : "Variant: Uncensored";
      if (currentModel) {
        if (currentModel.engine === "live2d") {
          loadLive2DModel(currentModel.id);
        } else {
          loadModel(currentModel.id);
        }
      }
    });

    // Scrubber scrubbing
    scrubber.addEventListener("input", () => {
      isScrubbing = true;
      const time = parseFloat(scrubber.value);
      if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
        const qm = currentLive2DModel.internalModel?.motionManager?.queueManager;
        const entry = qm?._motions?.[0];
        if (entry) {
          entry._stateTimeSeconds = time;
          const duration = entry._motion?.getDuration ? entry._motion.getDuration() : 0;
          timeDisplay.textContent = `${time.toFixed(2)}s / ${duration.toFixed(2)}s`;
        }
      } else {
        for (const l of loadedLayers) {
          if (l.activeTrack) {
            l.activeTrack.trackTime = time;
          }
          if (!isPlaying) {
            l.animState.apply(l.skeleton);
            l.skeleton.updateWorldTransform();
          }
        }
      }
    });

    scrubber.addEventListener("change", () => {
      isScrubbing = false;
    });

    // Screenshot PNG capture (high-resolution export at active canvas buffer resolution)
    function captureScreenshot() {
      let dataUrl = null;
      let w = 0, h = 0;
      if (currentModel && currentModel.engine === "live2d" && live2dApp) {
        dataUrl = live2dApp.view.toDataURL("image/png");
        w = live2dApp.view.width;
        h = live2dApp.view.height;
      } else if (canvas && skeleton) {
        dataUrl = canvas.toDataURL("image/png");
        w = canvas.width;
        h = canvas.height;
      }
      if (!dataUrl) return;
      const a = document.createElement("a");
      a.href = dataUrl;
      const shipPart = currentModel ? currentModel.ship_name.replace(/[^a-zA-Z0-9_\- ]/g, "").trim().replace(/\s+/g, "_") : "Model";
      const skinPart = currentModel ? currentModel.skin_name.replace(/[^a-zA-Z0-9_\- ]/g, "").trim().replace(/\s+/g, "_") : "Skin";
      const typePart = currentModel?.engine || "2D";
      a.download = `${shipPart}_${skinPart}_${typePart}.png`;
      a.click();
      showToast(`Snapshot saved: ${a.download} (${w}x${h})`);
    }

    btnScreenshot.addEventListener("click", captureScreenshot);

    // Main WebGL Render Loop
    function renderLoop() {
      const now = Date.now();
      const delta = (now - lastFrameTime) / 1000;
      lastFrameTime = now;
      if (currentModel && currentModel.engine === "live2d") {
        requestAnimationFrame(renderLoop);
        return;
      }

      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      if (loadedLayers.length > 0) {
        const speed = parseFloat(selectSpeed.value) || 1.0;
        const activeLayers = selectLayer.value === "all"
          ? loadedLayers
          : loadedLayers.filter(l => l.id === selectLayer.value);

        for (const l of activeLayers) {
          if (isPlaying && !isScrubbing) {
            l.animState.timeScale = speed;
            l.animState.update(delta);
          } else {
            l.animState.timeScale = 0;
          }
          l.animState.apply(l.skeleton);
          l.skeleton.updateWorldTransform();
        }

        // Update timeline UI
        if (activeTrack && activeTrack.animation) {
          const duration = activeTrack.animation.duration || 0;
          if (duration <= 0.001) {
            if (!isScrubbing) {
              scrubber.max = 0;
              scrubber.value = 0;
              scrubber.disabled = true;
            }
            timeDisplay.textContent = "Static (0.00s)";
          } else {
            const current = (activeTrack.trackTime % duration);
            if (!isScrubbing) {
              scrubber.disabled = false;
              scrubber.max = duration;
              scrubber.value = current;
            }
            timeDisplay.textContent = `${current.toFixed(2)}s / ${duration.toFixed(2)}s`;
          }
        }

        const pma = chkPma.checked;
        const showBones = chkBones.checked;

        sceneRenderer.begin();
        for (const l of activeLayers) {
          sceneRenderer.drawSkeleton(l.skeleton, pma);
          if (showBones) {
            sceneRenderer.drawSkeletonDebug(l.skeleton, pma);
          }
        }
        sceneRenderer.end();
      } else if (currentModel && currentModel.engine === "live2d" && currentLive2DModel) {
        const speed = parseFloat(selectSpeed.value) || 1.0;
        if (live2dApp && live2dApp.ticker) {
          live2dApp.ticker.speed = isPlaying ? speed : 0;
        }

        const qm = currentLive2DModel.internalModel?.motionManager?.queueManager;
        const entry = qm?._motions?.[0];
        if (entry && !entry.isFinished()) {
          const duration = entry._motion?.getDuration ? entry._motion.getDuration() : 0;
          const current = entry.getStateTime ? entry.getStateTime() : 0;
          if (duration > 0) {
            if (!isScrubbing) {
              scrubber.max = duration;
              scrubber.value = Math.min(current, duration);
            }
            timeDisplay.textContent = `${Math.min(current, duration).toFixed(2)}s / ${duration.toFixed(2)}s`;
          }
        }
      }
      requestAnimationFrame(renderLoop);
    }

    // Startup
    function startup() {
      initWebGL();
      loadCharacters();
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", startup);
    } else {
      startup();
    }
  </script>
</body>
</html>
